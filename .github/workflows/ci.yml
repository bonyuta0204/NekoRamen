name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_NOSPIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true
      - name: Install locked dependencies
        run: |
          python -m pip install pipenv==2026.8.0
          pipenv verify
          pipenv sync --dev
      - name: Check runtime export matches lock
        run: |
          pipenv requirements --hash > /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
      - name: Validate dependencies and offline behavior
        run: |
          pipenv run python -m pip check
          pipenv run python -m unittest discover -s tests -v
          pipenv run python -m compileall -q index.py ramen.py ScrapingFunctions.py twy.py tweet_neko_ramen.py
      - name: Audit locked dependencies
        run: |
          pipenv requirements --dev --hash > /tmp/all-requirements.txt
          pipenv run pip-audit -r /tmp/all-requirements.txt --strict
